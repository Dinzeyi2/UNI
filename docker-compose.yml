services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  nexus:
    build: .
    command: npm start
    environment:
      PORT: 4173
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus-development-only}@postgres:5432/nexus
    ports:
      - "4173:4173"
    depends_on:
      - postgres
volumes:
  postgres_data:
